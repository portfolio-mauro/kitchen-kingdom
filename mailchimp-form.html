<section class="waitlist-section" id="waitlist">
    <h2 class="section-heading">Join the Waitlist</h2>
    <p class="section-body">Be the first to know when Kitchen Kingdom launches and get a chance to <strong>win a copy with your name on it!</strong></p>
    <form action="https://eocampaign1.com/form/35eee478-516c-11f1-b558-67defba4d3c4"
          method="post"
          id="eo-subscribe-form"
          name="eo-subscribe-form"
          target="eo-hidden-iframe">
        <div id="eo_embed_signup_scroll">
            <div class="mc-field-group">
                <label for="eo-FNAME">First Name</label>
                <input type="text" name="field_1" class="text" id="eo-FNAME" value="" placeholder="John">
            </div>
            <div class="mc-field-group">
                <label for="eo-EMAIL">Email Address*</label>
                <input type="email" name="field_0" class="required email" id="eo-EMAIL" required value="" placeholder="john@mail.com">
            </div>
            <input type="submit" name="subscribe" id="eo-embedded-subscribe" class="mc-submit-btn" value="Join Waitlist">
        </div>
    </form>
    <div id="eo-responses">
        <div class="response" id="eo-error-response" style="display:none;"></div>
        <div class="response" id="eo-success-response" style="display:none;"></div>
    </div>
    <iframe name="eo-hidden-iframe" style="display:none;" aria-hidden="true"></iframe>
</section>
